<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор доставки бани</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--text:#1d1b18;--muted:#756f66;--accent:#b4531f;--accent-t:#fff;--line:#e3ddd3;--ok:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f18;--text:#f1ece3;--muted:#a39b8d;--accent:#e07a40;--accent-t:#1a1208;--line:#38332a;--ok:#7bd37f}}
:root[data-theme="dark"]{--bg:#17150f;--card:#221f18;--text:#f1ece3;--muted:#a39b8d;--accent:#e07a40;--accent-t:#1a1208;--line:#38332a;--ok:#7bd37f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input{width:100%;font-size:20px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.row span:first-child{color:var(--muted)}
.total{font-size:36px;font-weight:700;margin:4px 0 8px}
.free{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid input{font-size:16px;padding:10px}
button.reset{margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px}
</style>
</head>
<body>
<main>
<h1>Калькулятор доставки бани</h1>

<div class="card">
  <label for="km">Расстояние до клиента, км</label>
  <input id="km" type="number" inputmode="decimal" min="0" value="490">
  <div style="height:14px"></div>
  <label for="days">Дней на сборку</label>
  <input id="days" type="number" inputmode="numeric" min="0" value="4">
  <div class="chips" id="chips"></div>
</div>

<div class="card">
  <label>Стоимость доставки</label>
  <div class="total" id="total">—</div>
</div>

</main>

<script>
const DEFAULTS={km:45,drv:5,day:1800,liv:4000,far:4000,free:70};
const rates=DEFAULTS;

const presets=[
  {name:'Баня 2–2,5 м',days:4},
  {name:'Баня 3–4,5 м',days:4},
  {name:'Баня 5 м и более',days:4},
  {name:'Квадро-овал',days:4},
  {name:'Гриль-домик',days:4},
  {name:'Терраса (+1 день)',days:1,extra:true}
];
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
let base=null,terrace=false;

function renderChips(){
  $('chips').innerHTML='';
  presets.forEach((p,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='chip'+((p.extra?terrace:base===i)?' on':'');b.textContent=p.name;
    b.onclick=()=>{
      if(p.extra)terrace=!terrace;else base=(base===i?null:i);
      $('days').value=(base!==null?presets[base].days:0)+(terrace?1:0);
      renderChips();calc();
    };
    $('chips').appendChild(b);
  });
}

function calc(){
  const km=parseFloat($('km').value)||0, d=parseFloat($('days').value)||0, r=rates;
  if(km<=r.free){
    $('total').innerHTML='<span class="free">Бесплатно</span>';
    return;
  }
  $('total').textContent=fmt(km*r.km+km*r.drv+d*(r.day+r.liv)+r.far);
}

$('km').addEventListener('input',calc);
$('days').addEventListener('input',()=>{base=null;terrace=false;renderChips();calc()});
renderChips();calc();
</script>
</body>
</html>
